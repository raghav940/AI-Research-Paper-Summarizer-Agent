services:
  - type: web
    name: paper-summarizer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    pythonVersion: "3.10.12"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
